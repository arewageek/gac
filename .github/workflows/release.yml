name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output_name: gac-linux-amd64
          - goos: linux
            goarch: arm64
            output_name: gac-linux-arm64
          - goos: darwin
            goarch: amd64
            output_name: gac-darwin-amd64
          - goos: darwin
            goarch: arm64
            output_name: gac-darwin-arm64
          - goos: windows
            goarch: amd64
            output_name: gac-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o "${{ matrix.output_name }}" .

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.output_name }}
